spring.application.name=alertasp-soa
server.port=${SERVER_PORT:8080}

# PostgreSQL: a aplicação não usa banco em memória no perfil padrão.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/alertasp}
spring.datasource.username=${DB_USERNAME:alertasp}
spring.datasource.password=${DB_PASSWORD:alertasp_local_only}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate apenas valida o schema. Quem cria/altera tabelas é o Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.br.com.alertasp.soa=INFO
